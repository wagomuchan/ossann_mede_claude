<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16171c" />
    <title>おっさん観察</title>
    <meta name="description" content="おっさんの部屋をただ眺める。" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪟</text></svg>" />
    <style>
      :root {
        --bg: #16171c;
        --fg: #ece6dc;
        --muted: #8d8a85;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #veil {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(ellipse at center, rgba(22, 23, 28, 0.55), rgba(10, 10, 12, 0.92));
        backdrop-filter: blur(14px) saturate(0.7);
        -webkit-backdrop-filter: blur(14px) saturate(0.7);
        transition: opacity 1.6s ease, backdrop-filter 1.6s ease;
        z-index: 2;
        cursor: pointer;
        user-select: none;
      }
      #veil.gone {
        opacity: 0;
        pointer-events: none;
        backdrop-filter: blur(0) saturate(1);
        -webkit-backdrop-filter: blur(0) saturate(1);
      }
      #veil h1 {
        margin: 0;
        font-weight: 400;
        font-size: clamp(15px, 2.2vw, 19px);
        letter-spacing: 0.6em;
        padding-left: 0.6em;
        color: var(--muted);
      }
      #veil button {
        all: unset;
        font-size: clamp(22px, 4vw, 30px);
        letter-spacing: 0.5em;
        padding: 18px 26px 18px calc(26px + 0.5em);
        border: 1px solid rgba(236, 230, 220, 0.35);
        border-radius: 999px;
        color: var(--fg);
        transition: background 0.4s ease, border-color 0.4s ease;
      }
      #veil:hover button,
      #veil button:focus-visible {
        background: rgba(236, 230, 220, 0.08);
        border-color: rgba(236, 230, 220, 0.7);
      }
      #veil p {
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.2em;
      }
      #fail {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        color: var(--muted);
        line-height: 2;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="veil" role="button" tabindex="0" aria-label="のぞく">
      <h1>ある男の部屋</h1>
      <button type="button" tabindex="-1">のぞく</button>
      <p>音が出ます</p>
    </div>
    <div id="fail">このブラウザでは部屋をのぞけないようです。<br />WebGLに対応したブラウザでお試しください。</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
